[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "questa-mcp"
version = "0.0.1"
description = "Локальный MCP-сервер для детерминированного запуска регрессий и анализа симуляций Questa/ModelSim"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "chinn-choppa"}]
keywords = ["mcp", "fpga", "rtl", "eda", "vsim"]
dependencies = ["mcp==2.3.0"]

[project.scripts]
questa-mcp = "questa_mcp.server:main"

[project.urls]
Repository = "https://github.com/chinn-choppa/questa-mcp"
Issues = "https://github.com/chinn-choppa/questa-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/questa_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
